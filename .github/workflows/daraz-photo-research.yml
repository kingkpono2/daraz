name: Daraz original photo research (one-off)
on:
  push:
    paths:
      - '.github/workflows/daraz-photo-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow requests
      - name: Download current public Daraz photos for accurate composition audit
        run: python tools/photo_research.py
      - uses: actions/upload-artifact@v4
        with:
          name: authentic-daraz-photo-contact-sheet
          path: photo-research/
          retention-days: 7
