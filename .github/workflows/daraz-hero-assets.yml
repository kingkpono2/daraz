name: Curate real Daraz hero photos (one-off)
on:
  push:
    paths:
      - '.github/workflows/daraz-hero-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  curate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow requests
      - name: Composition-safe image processing from the live Daraz website
        run: python tools/prepare_hero_assets.py
      - name: Commit optimized hero WebP photos to the existing repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordpress-theme/daraz-law-shop/assets/images/hero
          git diff --cached --quiet && exit 0
          git commit -m "Add genuine Daraz hero photography, frame-safe WebP variants"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: daraz-real-hero-photos
          path: wordpress-theme/daraz-law-shop/assets/images/hero/
          retention-days: 14
