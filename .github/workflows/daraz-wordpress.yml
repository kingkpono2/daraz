name: Daraz WordPress theme - lint and ZIP
on:
  push:
    paths:
      - 'wordpress-theme/**'
      - 'tools/**'
      - '.github/workflows/daraz-wordpress.yml'
  workflow_dispatch:
jobs:
  lint-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint all WordPress PHP templates
        run: find wordpress-theme/daraz-law-shop -name '*.php' -type f -print0 | xargs -0 -n1 php -l
      - name: Adversarial integration smoke checks
        run: python3 tools/qa_theme.py
      - name: Check theme JavaScript
        run: node --check wordpress-theme/daraz-law-shop/assets/js/theme.js
      - name: Validate required theme files
        run: |
          test -f wordpress-theme/daraz-law-shop/style.css
          test -f wordpress-theme/daraz-law-shop/index.php
          test -f wordpress-theme/daraz-law-shop/functions.php
          test -f wordpress-theme/daraz-law-shop/404.php
          test -f wordpress-theme/daraz-law-shop/front-page.php
      - name: Set up Python image optimizer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer
        run: python -m pip install --quiet Pillow
      - name: Create optimized installable WordPress theme ZIP
        run: python tools/build_theme.py --theme wordpress-theme/daraz-law-shop --output daraz-law-shop.zip
      - name: Verify optimized ZIP contents and size
        run: |
          unzip -l daraz-law-shop.zip | grep -q 'daraz-law-shop/style.css'
          unzip -l daraz-law-shop.zip | grep -q 'daraz-law-shop/assets/images/editorial-home.webp'
          if unzip -l daraz-law-shop.zip | grep -q 'editorial-cart.png'; then exit 1; fi
          test "$(stat -c%s daraz-law-shop.zip)" -lt 3000000
      - name: Upload installable theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: daraz-law-shop-theme-zip
          path: daraz-law-shop.zip
          retention-days: 30
